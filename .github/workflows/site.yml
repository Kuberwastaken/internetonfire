name: Check and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify preinstalled browser dependencies
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          if (require('@playwright/test/package.json').version !== '1.56.1') {
            throw new Error('Update the pinned Playwright container to match package-lock.json');
          }
          const browser = await chromium.launch();
          await browser.close();
          JS
          python3 --version
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
