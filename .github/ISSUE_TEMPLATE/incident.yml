name: Add or correct an incident
description: Bring a source, a date and a short factual description.
title: "[Incident] "
body:
  - type: input
    id: name
    attributes:
      label: Incident name
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened, or what needs correcting?
      description: Say what is confirmed and what is still a claim. No private data.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and responses
      description: Link original advisories, reporting, X posts and vendor responses. HTTPS links only.
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date and timezone
      description: Distinguish event, disclosure and publication dates. Write unknown if unknown.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have not included credentials, private messages, leaked records or exploit payloads.
          required: true
        - label: I checked the incident log and open PRs for duplicates.
          required: true
